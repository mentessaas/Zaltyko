packages:
  - .

allowBuilds:
  '@scarf/scarf': true
  '@sentry/cli': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  '@vercel/speed-insights': true
  core-js: true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

# Keep the override map here for newer pnpm/Vercel resolvers. The repository
# pins pnpm 9.15.9, whose effective install hook is `pnpmfile.cjs`; the lockfile
# is regenerated from that hook so local and deployment installs share the
# patched graph instead of silently falling back to vulnerable transitive pins.
overrides:
  # React types pinned to match Next 15 / React 18.3 expectations
  '@types/react': 18.3.12
  '@types/react-dom': 18.3.5

  # --- Security CVEs (patched versions) ---
  # proxy-addr IP spoofing via malformed trusted IPv6 subnets (CVE-2026-90711)
  proxy-addr: ^2.0.8
  # source-map-js indexed-offset event-loop denial of service (CVE-2026-93749)
  source-map-js: ^1.2.2
  # MCP SDK OAuth credential routing (CVE-2026-104850)
  '@modelcontextprotocol/sdk': ^1.31.0
  # brace-expansion: DoS via unbounded expansion (CVE-2026-14257 + bypasses)
  'brace-expansion@1': ^1.1.21
  'brace-expansion@2': ^2.1.4
  'brace-expansion@5': ^5.0.12
  # fast-uri: host confusion / SSRF (multiple CVEs)
  fast-uri: ^3.1.6
  # ip-address: SSRF via leading-zero octets
  ip-address: ^10.3.1
  # js-yaml: quadratic CPU consumption in !!omap
  js-yaml: ^4.3.2
  # swagger-ui-react pins a vulnerable direct js-yaml release; force its
  # parser dependency onto the patched release as well.
  'swagger-ui-react>js-yaml': ^4.3.2
  # nanoid: custom/non-secure generator infinite loops (patched >=3.3.18)
  nanoid: ^3.3.18
  # browserslist: unbounded memory + prototype write
  browserslist: ^4.28.7
  # postcss: path traversal in previous source map + arbitrary file read
  postcss: 8.5.28
  'next>postcss': 8.5.28
  # sharp/librsvg memory-safety issue (CVE-2026-96889)
  sharp: ^0.35.5
  'next>sharp': ^0.35.5
  # qs / flatted / ajv pre-existing pins
  qs: ^6.14.2
  flatted: ^3.4.2
  'eslint>ajv': ^6.14.0
  # basic-ftp: CPU DoS in Unix directory listing parser (GHSA-c475-qrg2-pj4r)
  basic-ftp: ^6.2.1
  # DOMPurify: in-place sanitization hooks can leave handlers armed (GHSA-p98j-92pf-mc4p)
  dompurify: ^3.4.16
  # Lighthouse 13 upgrades its Puppeteer toolchain and removes vulnerable extract-zip
  # from @puppeteer/browsers; the Lighthouse job runs on Node 22.12+.
  lighthouse: ^13.5.0
  puppeteer-core: ^25.12.0
  proxy-agent: ^8.0.1
  # tmp: escritura arbitraria via parametro `dir` con symlink (GHSA-52f5-9888-hmc6)
  tmp: ^0.2.4
  # uuid: falta de comprobacion de limites en v3/v5/v6 con `buf` (GHSA-w5hq-g745-h8pq)
  uuid: ^11.1.1

  # --- Pre-existing dependency hygiene pins ---
  ws: ^8.21.0
  path-to-regexp: ^8.4.0
  protobufjs: ^7.6.5
  lodash: ^4.18.1
  immutable: ^4.3.9
  form-data: ^4.0.6
  vite: 6.4.3
  'picomatch@2': ^2.3.2
  'picomatch@4': ^4.0.4
  'minimatch@3': ^3.1.5
  'minimatch@7': ^7.4.9
  'minimatch@9': ^9.0.7
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  webpack: ^5.104.1
  '@babel/core': ^7.29.6
  '@opentelemetry/core': ^2.9.0

  # --- R1 fix 2026-09-06: pin Playwright a una unica version ---
  # @axe-core/playwright@4.13.0 introduce playwright-core@1.63.0 como dep
  # transitiva, dejando el lockfile con dos versiones (1.58.2 directo +
  # 1.63.0 transitivo). Tras #107 el smoke revienta: `pnpm exec playwright
  # install` bajo chromium-1208 (1.58.2) pero `playwright test` carga el
  # transitivo 1.63.0 que espera chromium-1243. Solucion: alinear el devDep
  # directo con el transitivo (1.63.0) para que haya una sola version.
  playwright: 1.63.0
  playwright-core: 1.63.0
  '@playwright/test': 1.63.0

onlyBuiltDependencies:
  - "@scarf/scarf"
  - "@sentry/cli"
  - "@tree-sitter-grammars/tree-sitter-yaml"
  - "@vercel/speed-insights"
  - core-js
  - core-js-pure
  - esbuild
  - protobufjs
  - sharp
  - tree-sitter
  - tree-sitter-json
  - unrs-resolver
