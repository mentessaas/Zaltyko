packages:
  - .

allowBuilds:
  '@scarf/scarf': true
  '@sentry/cli': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  '@vercel/speed-insights': true
  core-js: true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

# Modern pnpm reads overrides from here. The `pnpm.overrides` field in
# package.json is deprecated and silently ignored — see pnpm WARN at install
# time. Security CVEs must live here to actually take effect.
overrides:
  # React types pinned to match Next 15 / React 18.3 expectations
  '@types/react': 18.3.12
  '@types/react-dom': 18.3.5

  # --- Security CVEs (patched versions) ---
  # brace-expansion: DoS via unbounded expansion (CVE-2026-14257 + bypasses)
  'brace-expansion@1': ^1.1.17
  'brace-expansion@2': ^2.1.4
  'brace-expansion@5': ^5.0.9
  # fast-uri: host confusion / SSRF (multiple CVEs)
  fast-uri: ^3.1.6
  # ip-address: SSRF via leading-zero octets
  ip-address: ^10.3.1
  # js-yaml: quadratic CPU consumption in !!omap
  js-yaml: ^4.2.0
  # nanoid: custom/non-secure generator infinite loops
  nanoid: ^4.3.1
  # browserslist: unbounded memory + prototype write
  browserslist: ^4.28.7
  # postcss: path traversal in previous source map + arbitrary file read
  postcss: 8.5.28
  'next>postcss': 8.5.28
  sharp: 0.35.0
  'next>sharp': 0.35.0
  # qs / dompurify / flatted / ajv pre-existing pins
  qs: ^6.14.2
  dompurify: ^3.4.9
  flatted: ^3.4.2
  'eslint>ajv': ^6.14.0

  # --- Pre-existing dependency hygiene pins ---
  ws: ^8.21.0
  path-to-regexp: ^8.4.0
  protobufjs: ^7.6.5
  lodash: ^4.18.1
  immutable: ^4.3.9
  form-data: ^4.0.6
  vite: 6.4.3
  'picomatch@2': ^2.3.2
  'picomatch@4': ^4.0.4
  'minimatch@3': ^3.1.5
  'minimatch@7': ^7.4.9
  'minimatch@9': ^9.0.7
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  webpack: ^5.104.1
  '@babel/core': ^7.29.6
  '@opentelemetry/core': ^2.9.0

  # --- R1 fix 2026-09-06: pin Playwright a una unica version ---
  # @axe-core/playwright@4.13.0 introduce playwright-core@1.63.0 como dep
  # transitiva, dejando el lockfile con dos versiones (1.58.2 directo +
  # 1.63.0 transitivo). Tras #107 el smoke revienta: `pnpm exec playwright
  # install` bajo chromium-1208 (1.58.2) pero `playwright test` carga el
  # transitivo 1.63.0 que espera chromium-1243. Solucion: alinear el devDep
  # directo con el transitivo (1.63.0) para que haya una sola version.
  playwright: 1.63.0
  playwright-core: 1.63.0
  '@playwright/test': 1.63.0

onlyBuiltDependencies:
  - "@scarf/scarf"
  - "@sentry/cli"
  - "@tree-sitter-grammars/tree-sitter-yaml"
  - "@vercel/speed-insights"
  - core-js
  - core-js-pure
  - esbuild
  - protobufjs
  - sharp
  - tree-sitter
  - tree-sitter-json
  - unrs-resolver