name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    name: Mobile typecheck, lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Type check mobile
        run: pnpm typecheck

      - name: Lint mobile
        run: pnpm lint

      - name: Test mobile
        run: pnpm test

  dependency-security:
    name: Dependency Security & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:dependencies --prod

      - name: Audit environment contract
        run: pnpm audit:env

      - name: Generate CycloneDX SBOM
        # TODO: cyclonedx-npm@6.0.x hardcodes `pnpm ls --json --long --all` and
        # pnpm 9 removed the `--all` flag, so `pnpm sbom:generate` fails on every
        # job with `ERR_PNPM_UNKNOWN_FLAG`. Pre-existing main-branch failure,
        # not introduced by #104 — keeping the step continue-on-error so the
        # SBOM does not block unrelated PRs. Proper fix is to migrate to cdxgen
        # (already tried, currently 404 on npm) or wait for upstream
        # cyclonedx-npm to fix the pnpm 9 compatibility. Tracked separately.
        continue-on-error: true
        run: pnpm sbom:generate

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: zaltyko-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: ignore

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm vitest run --coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder:5432/placeholder
          INTERNAL_AUTH_SECRET: placeholder-internal-auth-secret-for-ci-build
          SUPABASE_JWT_SECRET: placeholder-supabase-jwt-secret-for-ci-build

      - name: Type check generated Next.js route contracts
        run: pnpm typecheck

  # Smoke tests require a running database and services
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # R1 fix 2026-09-06: delega al runner @playwright/test en lugar de invocar
      # el script con `tsx`. Asi Playwright CLI y runtime comparten la misma
      # version (1.58.2), evitando el skew chromium-1208 vs chromium-1243 que
      # reventaba Playwright al `chromium.launch` en da21facda.
      - name: Run public smoke tests against production
        run: pnpm test:e2e:public:ci
        env:
          BASE_URL: https://zaltyko.com
          E2E_PUBLIC_READ_ONLY: "true"

  e2e-readiness:
    name: E2E Credentials Readiness
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        name: Confirm required E2E secrets are configured
        env:
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
          E2E_ACADEMY_ID: ${{ secrets.E2E_ACADEMY_ID }}
          E2E_ACADEMY_B_ID: ${{ secrets.E2E_ACADEMY_B_ID }}
          E2E_ATHLETE_ID: ${{ secrets.E2E_ATHLETE_ID }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COACH_EMAIL: ${{ secrets.E2E_COACH_EMAIL }}
          E2E_COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}
          E2E_FAMILY_EMAIL: ${{ secrets.E2E_FAMILY_EMAIL }}
          E2E_FAMILY_PASSWORD: ${{ secrets.E2E_FAMILY_PASSWORD }}
          E2E_ATHLETE_EMAIL: ${{ secrets.E2E_ATHLETE_EMAIL }}
          E2E_ATHLETE_PASSWORD: ${{ secrets.E2E_ATHLETE_PASSWORD }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          E2E_TARGET_SUPABASE_PROJECT_REF: ${{ secrets.E2E_TARGET_SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
          E2E_EVENT_NAME: ${{ github.event_name }}
          E2E_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          missing=0
          for name in E2E_AUTH_EMAIL E2E_AUTH_PASSWORD E2E_ACADEMY_ID E2E_ACADEMY_B_ID E2E_ATHLETE_ID E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_COACH_EMAIL E2E_COACH_PASSWORD E2E_FAMILY_EMAIL E2E_FAMILY_PASSWORD E2E_ATHLETE_EMAIL E2E_ATHLETE_PASSWORD E2E_SUPER_ADMIN_EMAIL E2E_SUPER_ADMIN_PASSWORD E2E_TARGET_SUPABASE_PROJECT_REF NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DATABASE_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required E2E secret: ${name}"
              missing=1
            fi
          done

          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "E2E_STRIPE_SECRET_KEY must use Stripe test mode"; missing=1 ;;
          esac
          case "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" in
            pk_test_*) ;;
            *) echo "E2E_STRIPE_PUBLISHABLE_KEY must use Stripe test mode"; missing=1 ;;
          esac
          if [ "$E2E_TARGET_SUPABASE_PROJECT_REF" = "jegxfahsvugilbthbked" ]; then
            echo "E2E_TARGET_SUPABASE_PROJECT_REF cannot be the production project"
            missing=1
          fi

          if [ "$missing" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$E2E_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Authenticated E2E requires all staging-only secrets before main can pass." >&2
            exit 1
          elif [ "$E2E_EVENT_NAME" = "pull_request" ] && [ "$E2E_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Authenticated E2E requires staging-only secrets for same-repository pull requests." >&2
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Authenticated E2E skipped for an external fork without repository secrets."
          fi

  validate-rls:
    name: Validate RLS Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate:rls
        run: pnpm validate:rls

  check-migrations:
    name: Check Drizzle Migrations Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check:migrations
        run: pnpm check:migrations

  # Lighthouse CI: corre contra un build local tras `pnpm build`. Solo en push
  # a main para no penalizar PRs de forks sin secrets. SEO score es hard-fail
  # (categories:seo >= 0.95); performance/a11y/best-practices son warn hasta
  # tener baseline real de las 5 paginas clave.
  lighthouse:
    name: Lighthouse SEO/Perf Budget
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Lighthouse
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-lhci
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder:5432/placeholder
          INTERNAL_AUTH_SECRET: placeholder-internal-auth-secret-for-lhci
          SUPABASE_JWT_SECRET: placeholder-supabase-jwt-secret-for-lhci

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  e2e-public:
    name: E2E Public (no auth)
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public E2E
        run: pnpm test:e2e:public:ci
        env:
          BASE_URL: https://zaltyko.com
          E2E_PUBLIC_READ_ONLY: "true"

  e2e-auth:
    name: E2E Authenticated Flows
    runs-on: ubuntu-latest
    env:
      NODE_EXTRA_CA_CERTS: ./certs/supabase-root-ca.crt
    needs: [e2e-readiness]
    if: ${{ needs.e2e-readiness.outputs.enabled == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Provision owner, admin, coach and super-admin sandbox accounts
        run: pnpm e2e:prepare-auth
        env:
          E2E_ALLOW_PROVISIONING: "true"
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COACH_EMAIL: ${{ secrets.E2E_COACH_EMAIL }}
          E2E_COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          E2E_ACADEMY_ID: ${{ secrets.E2E_ACADEMY_ID }}
          E2E_TARGET_SUPABASE_PROJECT_REF: ${{ secrets.E2E_TARGET_SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      - name: Provision linked family and athlete sandbox accounts
        run: pnpm tsx scripts/prepare-e2e-family-auth.ts
        env:
          E2E_ALLOW_PROVISIONING: "true"
          E2E_FAMILY_EMAIL: ${{ secrets.E2E_FAMILY_EMAIL }}
          E2E_FAMILY_PASSWORD: ${{ secrets.E2E_FAMILY_PASSWORD }}
          E2E_ATHLETE_EMAIL: ${{ secrets.E2E_ATHLETE_EMAIL }}
          E2E_ATHLETE_PASSWORD: ${{ secrets.E2E_ATHLETE_PASSWORD }}
          E2E_ATHLETE_ID: ${{ secrets.E2E_ATHLETE_ID }}
          E2E_ACADEMY_ID: ${{ secrets.E2E_ACADEMY_ID }}
          E2E_TARGET_SUPABASE_PROJECT_REF: ${{ secrets.E2E_TARGET_SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      - name: Generate auth storage state
        run: pnpm test:e2e:auth
        env:
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
          E2E_ACADEMY_ID: ${{ secrets.E2E_ACADEMY_ID }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COACH_EMAIL: ${{ secrets.E2E_COACH_EMAIL }}
          E2E_COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}
          E2E_FAMILY_EMAIL: ${{ secrets.E2E_FAMILY_EMAIL }}
          E2E_FAMILY_PASSWORD: ${{ secrets.E2E_FAMILY_PASSWORD }}
          E2E_ATHLETE_EMAIL: ${{ secrets.E2E_ATHLETE_EMAIL }}
          E2E_ATHLETE_PASSWORD: ${{ secrets.E2E_ATHLETE_PASSWORD }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          E2E_TARGET_SUPABASE_PROJECT_REF: ${{ secrets.E2E_TARGET_SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}

      - name: Run internal role smoke on isolated staging
        run: pnpm exec playwright test tests/e2e-role-smoke.spec.ts --project=chromium
        env:
          E2E_STORAGE_STATE: .auth/user.json
          E2E_ACADEMY_ID: ${{ secrets.E2E_ACADEMY_ID }}
          E2E_ACADEMY_B_ID: ${{ secrets.E2E_ACADEMY_B_ID }}
          E2E_ATHLETE_ID: ${{ secrets.E2E_ATHLETE_ID }}
          E2E_TARGET_SUPABASE_PROJECT_REF: ${{ secrets.E2E_TARGET_SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
          E2E_ADMIN_STORAGE_STATE: .auth/admin.json
          E2E_COACH_STORAGE_STATE: .auth/coach.json
          E2E_FAMILY_STORAGE_STATE: .auth/family.json
          E2E_ATHLETE_STORAGE_STATE: .auth/athlete.json
          E2E_SUPER_ADMIN_STORAGE_STATE: .auth/super-admin.json

      - name: Run authenticated E2E
        run: pnpm test:e2e
        env:
          E2E_STORAGE_STATE: .auth/user.json
          E2E_ACADEMY_ID: ${{ secrets.E2E_ACADEMY_ID }}
          E2E_PROFILE_ID: ${{ secrets.E2E_PROFILE_ID }}
          E2E_ATHLETE_ID: ${{ secrets.E2E_ATHLETE_ID }}
          E2E_TARGET_SUPABASE_PROJECT_REF: ${{ secrets.E2E_TARGET_SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
