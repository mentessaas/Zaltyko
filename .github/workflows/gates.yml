name: Static Gates (operational)

on:
  schedule:
    # Daily at 02:07 UTC — picks a non-:00 slot so we don't share cron
    # capacity with other repos running at the top of the hour.
    - cron: "7 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/gates/**"
      - "src/**"
      - ".github/workflows/gates.yml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: gates-operational-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates-operational:
    name: Run gate:operational and persist artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ZAL-617 retention floor (closes ZAL-24's 3-day log window).
      GATE_RETENTION_DAYS: "14"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gate:operational
        # Operational mode is informational: it captures findings + applies
        # retention. It does NOT block the build on existing violations —
        # `pnpm gate:all` (run separately in CI for that purpose) is the
        # blocking entrypoint. Operational exits 0 unless the runner itself
        # crashes.
        run: pnpm gate:operational

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ github.run_id }}
          path: docs/audit/evidence/gates/
          # GitHub artifact retention — keeps the 14-day floor defensible
          # end-to-end (runner writes locally, artifact mirrors it remotely).
          retention-days: 14
          if-no-files-found: ignore