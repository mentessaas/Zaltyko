name: Canonical domain proposal and isolated SQL rehearsal

on:
  push:
    branches: [codex/mvp-main-bridge-20261025]
    paths:
      - .github/workflows/canonical-domain-proposal.yml
      - scripts/ci/prepare-canonical-domain-proposal.py
      - scripts/ci/verify-canonical-domain-rehearsal.sh
      - scripts/ci/canonical-domain-tenant-isolation.sql
      - supabase/schema-snapshot-manifest.json
      - supabase/schema-snapshots/20261024172153_sandbox_schema_snapshot_baseline.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposal:
    if: github.repository == 'mentessaas/Zaltyko' && github.ref == 'refs/heads/codex/mvp-main-bridge-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL AST parser on disposable runner
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pglast==7.21
      - name: Prepare review artefacts without a database or network
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sudo --preserve-env=PATH,GITHUB_ACTIONS,RUNNER_OS,GITHUB_SHA unshare --net -- bash -euc '
            test -z "$(ip route show default)"
            exec "$@"
          ' proposal python scripts/ci/prepare-canonical-domain-proposal.py \
            --snapshot supabase/schema-snapshots/20261024172153_sandbox_schema_snapshot_baseline.sql \
            --manifest supabase/schema-snapshot-manifest.json \
            --output artifacts/canonical-domain-proposal.sql \
            --manifest-output artifacts/canonical-domain-proposal.json \
            --rehearsal-output artifacts/canonical-domain-rehearsal.sql \
            --installation-review-output artifacts/canonical-domain-installation-review.sql \
            --migration-candidate-output artifacts/20261025202902_canonical_domain_installation_candidate.sql
      - name: Preserve proposal for independent review; never apply SQL
        uses: actions/upload-artifact@v7
        with:
          name: canonical-domain-proposal-${{ github.sha }}
          path: |
            artifacts/canonical-domain-*
            artifacts/20261025202902_canonical_domain_installation_candidate.sql
          retention-days: 3
          if-no-files-found: error

  rehearsal:
    name: Disposable PG17 rehearsal; preserve legacy and roll back
    needs: proposal
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: zaltyko_canonical_rehearsal_ci
          POSTGRES_USER: ci_bootstrap_superuser
          POSTGRES_PASSWORD: ci_only_no_external_access
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ci_bootstrap_superuser -d zaltyko_canonical_rehearsal_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare synthetic owner distinct from bootstrap superuser
        env:
          PGPASSWORD: ci_only_no_external_access
        run: |
          psql --no-psqlrc --no-password --set=ON_ERROR_STOP=1 \
            --host=127.0.0.1 --port=55432 --username=ci_bootstrap_superuser \
            --dbname=zaltyko_canonical_rehearsal_ci <<'SQL'
          BEGIN;
          DO $guard$
          BEGIN
            IF current_database() <> 'zaltyko_canonical_rehearsal_ci'
               OR current_user <> 'ci_bootstrap_superuser'
               OR EXISTS (SELECT 1 FROM pg_roles WHERE rolname='postgres') THEN
              RAISE EXCEPTION 'Disposable bootstrap owner guard failed';
            END IF;
          END
          $guard$;
          CREATE ROLE postgres LOGIN PASSWORD 'ci_only_no_external_access'
            SUPERUSER BYPASSRLS CREATEDB CREATEROLE;
          ALTER DATABASE zaltyko_canonical_rehearsal_ci OWNER TO postgres;
          COMMIT;
          SQL
      - name: Download only this commit's review artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: canonical-domain-proposal-${{ github.sha }}
          path: artifacts
      - name: Rehearse only against disposable loopback PostgreSQL
        env:
          CANONICAL_DOMAIN_REHEARSAL_CI: '1'
          CANONICAL_REHEARSAL_DATABASE_URL: postgresql://postgres:ci_only_no_external_access@127.0.0.1:55432/zaltyko_canonical_rehearsal_ci?sslmode=disable
        run: >-
          bash scripts/ci/verify-canonical-domain-rehearsal.sh
          artifacts/canonical-domain-rehearsal.sql
          artifacts/canonical-domain-proposal.json
