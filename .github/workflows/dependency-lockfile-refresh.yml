name: Dependency lockfile refresh

# Regenera los lockfiles en un runner limpio para que nadie tenga que instalar
# dependencias en local. Solo lee el repositorio: no hace commit, no hace push,
# no usa secretos y no ejecuta scripts de instalación. Deja los tres lockfiles
# y su diff como artefacto; una persona (o agente) los revisa y los sube en su
# propia rama, donde la CI normal los valida con `--frozen-lockfile`.
#
# Cómo se lanza:
#   - Push a una rama `lockfile-refresh/**` con los cambios de package.json,
#     pnpmfile.cjs u overrides ya hechos (sirve antes de que este fichero
#     exista en `main`).
#   - Manual (workflow_dispatch) eligiendo la rama, una vez en `main`.
#
# Alcance: `pnpm install --lockfile-only` y `npm install --package-lock-only`
# respetan las versiones ya bloqueadas y solo vuelven a resolver lo que piden
# los manifiestos, overrides y el hook cambiados. No es un `pnpm update`.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Lockfiles a regenerar"
        type: choice
        default: all
        options:
          - all
          - web
          - mobile
  push:
    branches:
      - "lockfile-refresh/**"

permissions:
  contents: read

concurrency:
  group: dependency-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate lockfiles (no install, no scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGETS: ${{ inputs.targets || 'all' }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # pnpm 9.15.9 sale de `packageManager` en el package.json raíz; es la
      # misma versión que usan los jobs de CI de la web y de la app móvil.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      # Node 22 cumple a la vez los engines de la web y de mobile (>=22).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Record tool versions
        run: |
          node --version
          pnpm --version
          npm --version
          npx --yes npm@11.21.1 --version

      - name: Web — pnpm-lock.yaml
        if: env.TARGETS == 'all' || env.TARGETS == 'web'
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Mobile — pnpm-lock.yaml
        if: env.TARGETS == 'all' || env.TARGETS == 'mobile'
        working-directory: mobile
        run: pnpm install --lockfile-only --ignore-scripts --ignore-workspace

      # npm 10 (el de Node 22) se rompe con el ciclo de peers opcionales de
      # vite 8 (@vitejs/devtools -> vitest@*): «Cannot read properties of null
      # (reading 'edgesOut')» en arborist. npm 11.21.1 lo resuelve sin
      # --legacy-peer-deps. Versión fijada para que el resultado sea repetible.
      - name: Mobile — package-lock.json
        if: env.TARGETS == 'all' || env.TARGETS == 'mobile'
        working-directory: mobile
        run: |
          npx --yes npm@11.21.1 install --package-lock-only --ignore-scripts --no-audit --no-fund || {
            tail -n 80 "$HOME"/.npm/_logs/*-debug-0.log
            exit 1
          }

      - name: Fail if anything other than lockfiles changed
        run: |
          git status --porcelain
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v -x -E 'pnpm-lock.yaml|mobile/pnpm-lock.yaml|mobile/package-lock.json' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Cambios fuera de los lockfiles: $unexpected"
            exit 1
          fi

      - name: Check the regenerated pnpm lockfiles are frozen-consistent
        run: |
          if [ "$TARGETS" != mobile ]; then pnpm install --frozen-lockfile --lockfile-only --ignore-scripts; fi
          if [ "$TARGETS" != web ]; then (cd mobile && pnpm install --frozen-lockfile --lockfile-only --ignore-scripts --ignore-workspace); fi

      - name: Write diff summary
        run: |
          mkdir -p "$RUNNER_TEMP/lockfile-refresh"
          git diff --stat | tee "$RUNNER_TEMP/lockfile-refresh/diff-stat.txt"
          git diff > "$RUNNER_TEMP/lockfile-refresh/lockfiles.diff"
          cp pnpm-lock.yaml "$RUNNER_TEMP/lockfile-refresh/pnpm-lock.yaml"
          mkdir -p "$RUNNER_TEMP/lockfile-refresh/mobile"
          cp mobile/pnpm-lock.yaml mobile/package-lock.json "$RUNNER_TEMP/lockfile-refresh/mobile/"
          {
            echo "### Lockfiles regenerados"
            echo
            echo '```'
            cat "$RUNNER_TEMP/lockfile-refresh/diff-stat.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated lockfiles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regenerated-lockfiles
          path: ${{ runner.temp }}/lockfile-refresh
          retention-days: 7
          if-no-files-found: error
