<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14307F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Sin conexión - Zaltyko</title>
  <!--
    «Magnesio sobre tapiz» sin dependencias externas: esta página se sirve
    desde la caché del service worker cuando no hay red, así que no carga
    fuentes ni hojas de estilo. Archivo solo si está instalada; si no, la
    pila del sistema. Valores de las escalas del mundo (DESIGN.md).
    Sin JavaScript: la CSP con nonce bloquea scripts y manejadores en línea,
    así que «Reintentar» es un enlace normal a la portada.
  -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --mat: #1E3FA8;
      --mat-deep: #14307F;
      --mat-night: #0B1430;
      --chalk: #F4F6F2;
      --ramp-600: #3E4A66;
    }

    body {
      font-family: Archivo, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--mat);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }

    /* Marco de cinta: borde blanco de 3 px al 80 %, inset 12 px. */
    body::before {
      content: "";
      position: fixed;
      inset: 12px;
      border: 3px solid rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    .container {
      position: relative;
      max-width: 360px;
      width: 100%;
    }

    .brand {
      font-weight: 900;
      font-stretch: 72%;
      letter-spacing: 0.02em;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .icon {
      width: 40px;
      height: 40px;
      color: #8FB4FF;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(40px, 12vw, 56px);
      font-weight: 900;
      font-stretch: 72%;
      line-height: 0.92;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
      margin: 20px 0 32px;
      padding-top: 16px;
      border-top: 3px solid #FFFFFF;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      background: #FFFFFF;
      color: var(--mat-deep);
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      padding: 0 28px;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 150ms ease-out;
      box-shadow: 0 8px 20px -10px rgba(11, 20, 48, 0.8);
    }

    .retry-btn:hover {
      background: var(--chalk);
    }

    .retry-btn:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }

    .retry-btn:active {
      transform: scale(0.99);
    }

    .retry-btn svg {
      width: 18px;
      height: 18px;
    }

    @media (prefers-reduced-motion: reduce) {
      .retry-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">ZALTYKO</div>

    <svg class="icon" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 9.238l2.829-2.829m-2.829 2.829L21 21m-6.363-6.363a5 5 0 01-7.072 0m0 0L9.66 8.464m4.243-2.829a4.978 4.978 0 012.83-1.414m1.414 5.658a9 9 0 012.167-9.238m-7.824 9.238l2.829 2.829" />
    </svg>

    <h1>Sin conexión</h1>
    <p>No se pudo conectar con el servidor. Verifica tu conexión a internet e intenta de nuevo.</p>

    <a class="retry-btn" href="/">
      <svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Reintentar
    </a>
  </div>

</body>
</html>
